
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="logo.webp">
    <link rel="stylesheet" href="styles.css">
    <title>Monarch | Achievements</title>
</head>

<body style="margin:0; min-height:100vh; font-family:sans-serif; background-image:url('images.jpg'); background-size:cover; background-position:center; background-attachment:fixed;">

<!-- Mobile menu button (fixed to the viewport; outside the nav because
     backdrop-filter on the nav would pin any fixed descendant to it) -->
<button id="mobileToggle" onclick="toggleSidebar()" aria-label="Open menu" aria-expanded="false">&#9744;</button>

<nav id="sidebar" style="position:fixed; top:0; left:0; width:240px; height:100vh; box-sizing:border-box; background:rgba(255,255,255,0.13); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:1000; display:flex; flex-direction:column; align-items:center; padding:25px 12px; box-shadow:4px 0 30px rgba(0,0,0,0.05); transition:width 0.3s ease; overflow-x:hidden;">

    <button id="toggleButton" onclick="toggleSidebar()" aria-label="Collapse sidebar" style="align-self:flex-end; border:none; background:rgba(9,32,75,0.08); color:rgba(9,32,75,0.99); font-size:20px; cursor:pointer; border-radius:8px; padding:7px 12px; margin-bottom:25px;">☰</button>

    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:40px; width:100%;">
        <img src="logo.webp" alt="Monarch Logo" style="width:42px; height:42px; border-radius:50%; object-fit:cover; flex-shrink:0;">
        <span class="sidebar-label" style="font-size:20px; font-weight:bold; letter-spacing:2px; color:rgba(9,32,75,0.99); white-space:nowrap;">MONARCH</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px; width:100%;">

        <a href="home.html" title="Home" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; box-sizing:border-box; transition:background 0.3s;">
            <span style="font-size:21px; min-width:25px; text-align:center;">⌂</span>
            <span class="sidebar-label">Home</span>
        </a>

        <a href="about.html" title="About" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; box-sizing:border-box; transition:background 0.3s;">
            <span style="font-size:21px; min-width:25px; text-align:center;">ⓘ</span>
            <span class="sidebar-label">About</span>
        </a>

        <a href="members.html" title="Members" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; box-sizing:border-box; transition:background 0.3s;">
            <span style="font-size:21px; min-width:25px; text-align:center;">♟</span>
            <span class="sidebar-label">Members</span>
        </a>

        <a href="achievements.html" title="Achievements" aria-current="page" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; background:rgba(9,32,75,0.13); border-left:4px solid rgba(9,32,75,0.85); box-sizing:border-box;">
            <span style="font-size:21px; min-width:25px; text-align:center;">🏆</span>
            <span class="sidebar-label">Achievements</span>
        </a>

        <a href="timeline.html" title="Timeline" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; box-sizing:border-box; transition:background 0.3s;">
            <span style="font-size:21px; min-width:25px; text-align:center;">✉</span>
            <span class="sidebar-label">Timeline</span>
        </a>

        <a href="JoinUs.html" title="Join Us" style="text-decoration:none; color:rgba(9,32,75,0.99); font-weight:bold; padding:14px 15px; border-radius:8px; display:flex; align-items:center; gap:15px; box-sizing:border-box; transition:background 0.3s;">
            <span style="font-size:21px; min-width:25px; text-align:center;">✉</span>
            <span class="sidebar-label">Join Us</span>
        </a>

    </div>
</nav>

<main id="mainContent" style="margin-left:240px; min-height:100vh; box-sizing:border-box; display:flex; justify-content:center; align-items:center; padding:40px; transition:margin-left 0.3s ease;">

            </div>

            <div style="display:flex; justify-content:center; gap:35px; margin:25px 0; flex-wrap:wrap;">

                <div>
                    <p style="font-size:0.85rem; margin:0 0 5px; color:rgba(0,0,0,0.7);">Peak Rank</p>
                    <h2 style="font-size:2rem; margin:0; color:rgba(9,32,75,0.99);">38</h2>
                </div>

                <div>
                    <p style="font-size:0.85rem; margin:0 0 5px; color:rgba(0,0,0,0.7);">Peak Rating</p>
                    <h2 style="font-size:2rem; margin:0; color:rgba(9,32,75,0.99);">1913</h2>
                </div>

            </div>

            <div style="margin:25px 0;">
                <p style="font-weight:bold; margin-bottom:12px;">Team Members</p>
                <p style="line-height:1.8; margin:0;">
                    Crownless · wKhan · Eze · Thorrija
                </p>
            </div>

            <a href="https://2026a.battlecode.co.uk/game/team" target="_blank" rel="noopener noreferrer" style="display:inline-block; margin-top:10px; padding:11px 22px; border-radius:8px; background:rgba(9,32,75,0.9); color:white; text-decoration:none; font-weight:bold;">
                View Competition
            </a>

        </div>

        <p style="margin-top:30px; color:#98FB98; font-weight:bold;">
            Long live the Ñ
        </p>

    </div>

</main>

<script src="sidebar.js"></script>
